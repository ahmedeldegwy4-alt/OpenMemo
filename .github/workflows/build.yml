name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q OpenMemo.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: OpenMemo
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: |
          mkdir -p out
          cp OpenMemo/app/build/outputs/apk/release/*.apk out/OpenMemo-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenMemo build ${{ github.run_number }}
          files: out/*.apk
